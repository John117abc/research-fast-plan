# F1 deterministic parameter table v1.2 (NOT CARLA random seeds).
# Constraint discovered by smoke: CARLA spawn on the frozen segment is only
# reliable for station s <= ~80 (segment extends to 208 but spawn off-drivable
# geometry beyond ~85). All static/lead/cross objects therefore stay inside the
# safe station window; D1 left "stream" is a slow platoon (1.5 m/s, stations
# 30..78) that keeps the merge window occupied through the whole horizon.
# A-class d_conflict stays >=45 so the bracketing window precedes reachability.

